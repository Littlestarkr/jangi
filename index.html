<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장기 대국 - 초보 · 중급 · 전문가</title>
<style>
  :root{
    --bg: #eef1f5;
    --panel: #ffffff;
    --panel-border: #dfe3ea;
    --text: #1c2130;
    --text-dim: #6b7280;
    --accent: #2f6feb;
    --accent-text: #ffffff;
    --board-bg: #e7c98a;
    --board-line: #5b3d1f;
    --board-line-soft: #8a6a3e;
    --han-fill: #1e3a8a;
    --han-stroke: #0f2050;
    --cho-fill: #b3261e;
    --cho-stroke: #6e1410;
    --piece-text: #fdf6e3;
    --sel-ring: #ffcc33;
    --move-dot: #2f6feb;
    --capture-ring: #d92626;
    --check-glow: #d92626;
    --lastmove-color: #ffb020;
    --btn-bg: #f2f4f8;
    --btn-bg-hover: #e5e9f0;
    --accent-soft: #e4ecff;
    --shadow: 0 6px 20px rgba(20,25,40,0.12);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #14171f;
      --panel: #1c2029;
      --panel-border: #2c3140;
      --text: #eef1f6;
      --text-dim: #9aa2b1;
      --accent: #5b8cff;
      --accent-text: #0c1220;
      --board-bg: #7a5a34;
      --board-line: #2a1b0e;
      --board-line-soft: #4a3520;
      --han-fill: #3a5cc9;
      --han-stroke: #16234f;
      --cho-fill: #d8443a;
      --cho-stroke: #6e1410;
      --piece-text: #fff8ea;
      --btn-bg: #262b37;
      --btn-bg-hover: #323847;
      --accent-soft: #24304d;
      --lastmove-color: #ffb020;
      --shadow: 0 6px 24px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg: #14171f;
    --panel: #1c2029;
    --panel-border: #2c3140;
    --text: #eef1f6;
    --text-dim: #9aa2b1;
    --accent: #5b8cff;
    --accent-text: #0c1220;
    --board-bg: #7a5a34;
    --board-line: #2a1b0e;
    --board-line-soft: #4a3520;
    --han-fill: #3a5cc9;
    --han-stroke: #16234f;
    --cho-fill: #d8443a;
    --cho-stroke: #6e1410;
    --piece-text: #fff8ea;
    --btn-bg: #262b37;
    --btn-bg-hover: #323847;
    --accent-soft: #24304d;
    --lastmove-color: #ffb020;
    --shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
  html, body{
    height:100%;
    margin:0;
  }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    display:flex;
    justify-content:center;
    min-height:100%;
  }
  #app{
    width:100%;
    max-width: 560px;
    padding: 16px 14px calc(16px + env(safe-area-inset-bottom,0px));
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  h1{
    font-size: 1.25rem;
    margin: 4px 0 0 0;
    text-align:center;
    letter-spacing: -0.02em;
  }
  .sub{
    text-align:center;
    color: var(--text-dim);
    font-size: 0.88rem;
    margin: -6px 0 4px 0;
  }
  .panel{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .diffGrid{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top: 8px;
  }
  .diffBtn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--btn-bg);
    color: var(--text);
    font-size: 1rem;
    font-weight:600;
    cursor:pointer;
    text-align:left;
  }
  .diffBtn:hover{ background: var(--btn-bg-hover); }
  .diffBtn .desc{
    font-weight:400;
    font-size:0.82rem;
    color: var(--text-dim);
    display:block;
    margin-top:2px;
  }
  .diffBtn .tag{
    flex-shrink:0;
    font-size:1.4rem;
  }
  .formSection{
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px solid var(--panel-border);
  }
  .formTitle{
    font-weight:700;
    font-size:0.95rem;
  }
  .formHint{
    color: var(--text-dim);
    font-size:0.8rem;
    margin-top:2px;
    margin-bottom:10px;
  }
  .formRow{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .formRow .formLabel{
    width: 54px;
    flex-shrink:0;
    font-size:0.85rem;
    color: var(--text-dim);
    font-weight:600;
  }
  .formOpts{
    display:flex;
    gap:8px;
    flex:1;
  }
  .formOptBtn{
    flex:1;
    padding: 9px 6px;
    border-radius: 10px;
    border: 1.5px solid var(--panel-border);
    background: var(--btn-bg);
    color: var(--text);
    font-size:0.88rem;
    font-weight:700;
    letter-spacing: 0.05em;
    cursor:pointer;
  }
  .formOptBtn.active{
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  #statusBar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: var(--shadow);
    font-size: 0.92rem;
  }
  #statusBar .who{ font-weight:700; }
  #statusBar .turnDot{
    display:inline-block;
    width:10px;height:10px;border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
  }
  #statusBar .checkTag{
    color: var(--check-glow);
    font-weight:800;
    margin-left:8px;
  }
  #boardWrap{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 12px;
    display:flex;
    justify-content:center;
  }
  svg#board{
    width:100%;
    height:auto;
    max-width: 480px;
    touch-action: manipulation;
  }
  .controls{
    display:flex;
    gap:10px;
  }
  .ctrlBtn{
    flex:1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--btn-bg);
    color: var(--text);
    font-size:0.92rem;
    font-weight:600;
    cursor:pointer;
  }
  .ctrlBtn:hover{ background: var(--btn-bg-hover); }
  .hidden{ display:none !important; }
  #overlay{
    position: fixed;
    inset:0;
    background: rgba(10,12,18,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 20;
  }
  #overCard{
    background: var(--panel);
    border-radius: 18px;
    padding: 26px 22px;
    max-width: 340px;
    width:100%;
    text-align:center;
    box-shadow: var(--shadow);
    border: 1px solid var(--panel-border);
  }
  #overCard h2{ margin: 0 0 6px 0; font-size:1.3rem; }
  #overCard p{ color: var(--text-dim); margin: 0 0 18px 0; font-size:0.92rem; }
  #thinkTag{
    font-size:0.82rem;
    color: var(--accent);
    font-weight:700;
    min-width: 70px;
    text-align:right;
  }
</style>
</head>
<body>
<div id="app">
  <h1>장기 (Janggi)</h1>
  <div class="sub">한 판의 승부, 궁을 지켜라</div>

  <div id="setupScreen" class="panel">
    <div class="formSection" style="border-top:none; padding-top:0;">
      <div class="formTitle">내 진영 배치 (마상 / 상마)</div>
      <div class="formHint">차 다음 칸에 마와 상을 어떤 순서로 놓을지 선택하세요. 상대 배치는 매 판 무작위로 정해집니다.</div>
      <div class="formRow">
        <span class="formLabel">왼쪽</span>
        <div class="formOpts">
          <button class="formOptBtn" data-side="left" data-val="ma-sang">마상</button>
          <button class="formOptBtn" data-side="left" data-val="sang-ma">상마</button>
        </div>
      </div>
      <div class="formRow" style="margin-bottom:0;">
        <span class="formLabel">오른쪽</span>
        <div class="formOpts">
          <button class="formOptBtn" data-side="right" data-val="ma-sang">마상</button>
          <button class="formOptBtn" data-side="right" data-val="sang-ma">상마</button>
        </div>
      </div>
    </div>
    <div class="formSection">
      <div class="formTitle">난이도를 선택하세요</div>
      <div class="formHint" style="margin-bottom:0;">플레이어는 초(楚, 붉은색 · 아래)를 잡고 먼저 둡니다.</div>
    </div>
    <div class="diffGrid">
      <button class="diffBtn" data-level="beginner">
        <span>
          왕초보
          <span class="desc">컴퓨터가 대부분 무작위로 둡니다. 규칙 익히기용</span>
        </span>
        <span class="tag">🌱</span>
      </button>
      <button class="diffBtn" data-level="intermediate">
        <span>
          중급
          <span class="desc">몇 수 앞을 내다보고 둡니다. 적당한 긴장감</span>
        </span>
        <span class="tag">⚔️</span>
      </button>
      <button class="diffBtn" data-level="expert">
        <span>
          전문가
          <span class="desc">가능한 깊이 읽어 최선의 수를 찾습니다</span>
        </span>
        <span class="tag">🧠</span>
      </button>
    </div>
    <div id="resumeRow" class="hidden" style="margin-top:14px;">
      <button id="resumeBtn" class="ctrlBtn" style="width:100%;">이어하기 (저장된 게임 있음)</button>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <div id="statusBar">
      <div><span class="turnDot" id="turnDot"></span><span class="who" id="turnText">초 차례</span><span id="checkTag" class="checkTag hidden">장군!</span></div>
      <div id="thinkTag"></div>
    </div>
    <div id="boardWrap">
      <svg id="board" viewBox="0 0 528 584" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="controls">
      <button class="ctrlBtn" id="undoBtn">↩ 한 수 무르기</button>
      <button class="ctrlBtn" id="restartBtn">🔄 새 게임</button>
      <button class="ctrlBtn" id="menuBtn">☰ 난이도 변경</button>
    </div>
  </div>
</div>

<div id="overlay" class="hidden">
  <div id="overCard">
    <h2 id="overTitle">대국 종료</h2>
    <p id="overDesc">결과 설명</p>
    <button class="ctrlBtn" id="overRestart" style="width:100%; margin-bottom:8px;">다시 시작</button>
    <button class="ctrlBtn" id="overMenu" style="width:100%;">난이도 변경</button>
  </div>
</div>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장기 (Janggi) - 지적 동반자와의 대국</title>
    <style>
        :root {
            --bg-color: #f4f4f5;
            --panel-bg: #ffffff;
            --text-color: #27272a;
            --board-bg: #e6c280;
            --line-color: #785a28;
            --accent-color: #3f3f46;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #71717a;
            margin-bottom: 15px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        select, button {
            padding: 6px 12px;
            font-size: 0.9rem;
            border: 1px solid #d4d4d8;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button {
            background-color: #27272a;
            color: #fff;
            border: none;
            font-weight: 500;
        }

        button:hover {
            background-color: #3f3f46;
        }

        .status {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 12px;
            height: 24px;
            display: flex;
            align-items: center;
        }

        .board-wrapper {
            background-color: var(--board-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
        }

        canvas {
            display: block;
        }

        .footer-note {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #a1a1aa;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>전통 장 기 (Janggi)</h1>
    <div class="subtitle">초(작가님)와 한(AI)의 사유의 대국</div>

    <div class="controls">
        <div>
            <label for="difficulty">난이도: </label>
            <select id="difficulty">
                <option value="easy">초보용</option>
                <option value="normal" selected>중급용</option>
                <option value="hard">전문가용</option>
            </select>
        </div>
        <div>
            <label for="formation">상마진형: </label>
            <select id="formation">
                <option value="ma-sang">마상마상 (기본)</option>
                <option value="sang-ma">상마상마</option>
            </select>
        </div>
        <button id="restartBtn">새 게임 시작</button>
    </div>

    <div class="status" id="statusText">초(작가님)의 차례입니다. (초록색 말)</div>

    <div class="board-wrapper">
        <canvas id="janggiBoard" width="420" height="460"></canvas>
    </div>

    <div class="footer-note">격물치지의 마음으로 한 수 한 수 정성을 다합니다.</div>
</div>

<script>
    const canvas = document.getElementById('janggiBoard');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const restartBtn = document.getElementById('restartBtn');
    const difficultySelect = document.getElementById('difficulty');
    const formationSelect = document.getElementById('formation');

    const COLS = 9;
    const ROWS = 10;
    const CELL_W = canvas.width / COLS;
    const CELL_H = canvas.height / ROWS;

    // 기물 정의: type, owner (1: 초/플레이어, 2: 한/AI), name, value
    // 한(2): 상단, 초(1): 하단
    let board = [];
    let turn = 1; // 1: 초(플레이어), 2: 한(AI)
    let selectedPiece = null;
    let validMoves = [];
    let gameOver = false;
    let isAITurn = false;

    const PIECE_NAMES = {
        'car': '차', 'elephant': '상', 'horse': '마',
        'guard': '사', 'general': '장', 'cannon': '포', 'soldier': '졸/병'
    };

    function initBoard() {
        board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));

        const formation = formationSelect.value; // 'ma-sang' 또는 'sang-ma'
        let p1Order, p2Order;
        if (formation === 'ma-sang') {
            p1Order = ['car', 'elephant', 'horse', 'guard', null, 'guard', 'horse', 'elephant', 'car'];
            p2Order = ['car', 'horse', 'elephant', 'guard', null, 'guard', 'elephant', 'horse', 'car'];
        } else {
            p1Order = ['car', 'horse', 'elephant', 'guard', null, 'guard', 'elephant', 'horse', 'car'];
            p2Order = ['car', 'elephant', 'horse', 'guard', null, 'guard', 'horse', 'elephant', 'car'];
        }

        // 한(2) 배치 (상단)
        board[0] = p2Order.map(type => type ? { type, owner: 2 } : null);
        board[2][1] = { type: 'cannon', owner: 2 };
        board[2][7] = { type: 'cannon', owner: 2 };
        board[3] = [
            { type: 'soldier', owner: 2 }, null,
            { type: 'soldier', owner: 2 }, null,
            { type: 'soldier', owner: 2 }, null,
            { type: 'soldier', owner: 2 }, null,
            { type: 'soldier', owner: 2 }
        ];
        board[1][4] = { type: 'general', owner: 2 }; // 궁

        // 초(1) 배치 (하단)
        board[9] = p1Order.map(type => type ? { type, owner: 1 } : null);
        board[7][1] = { type: 'cannon', owner: 1 };
        board[7][7] = { type: 'cannon', owner: 1 };
        board[6] = [
            { type: 'soldier', owner: 1 }, null,
            { type: 'soldier', owner: 1 }, null,
            { type: 'soldier', owner: 1 }, null,
            { type: 'soldier', owner: 1 }, null,
            { type: 'soldier', owner: 1 }
        ];
        board[8][4] = { type: 'general', owner: 1 }; // 궁

        turn = 1;
        selectedPiece = null;
        validMoves = [];
        gameOver = false;
        isAITurn = false;
        statusText.textContent = "초(작가님)의 차례입니다.";
        drawBoard();
    }

    function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 장기판 배경 선 그리기
        ctx.strokeStyle = '#785a28';
        ctx.lineWidth = 1.5;

        for (let r = 0; r < ROWS; r++) {
            ctx.beginPath();
            ctx.moveTo(CELL_W * 0.5, CELL_H * (r + 0.5));
            ctx.lineTo(CELL_W * (COLS - 0.5), CELL_H * (r + 0.5));
            ctx.stroke();
        }
        for (let c = 0; c < COLS; c++) {
            ctx.beginPath();
            ctx.moveTo(CELL_W * (c + 0.5), CELL_H * 0.5);
            ctx.lineTo(CELL_W * (c + 0.5), CELL_H * (ROWS - 0.5));
            ctx.stroke();
        }

        // 궁성 대각선
        drawPalace(3, 0, 5, 2); // 한 궁성
        drawPalace(3, 7, 5, 9); // 초 궁성

        // 선택 영역 및 이동 가능 위치 표시
        if (selectedPiece) {
            ctx.fillStyle = 'rgba(59, 130, 246, 0.3)';
            ctx.beginPath();
            ctx.arc(
                CELL_W * (selectedPiece.c + 0.5),
                CELL_H * (selectedPiece.r + 0.5),
                CELL_W * 0.42, 0, Math.PI * 2
            );
            ctx.fill();

            ctx.fillStyle = 'rgba(16, 185, 129, 0.6)';
            for (let m of validMoves) {
                ctx.beginPath();
                ctx.arc(
                    CELL_W * (m.c + 0.5),
                    CELL_H * (m.r + 0.5),
                    CELL_W * 0.2, 0, Math.PI * 2
                );
                ctx.fill();
            }
        }

        // 기물 그리기
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let p = board[r][c];
                if (p) {
                    drawPiece(c, r, p);
                }
            }
        }
    }

    function drawPalace(sc, sr, ec, er) {
        ctx.beginPath();
        ctx.moveTo(CELL_W * (sc + 0.5), CELL_H * (sr + 0.5));
        ctx.lineTo(CELL_W * (ec + 0.5), CELL_H * (er + 0.5));
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(CELL_W * (ec + 0.5), CELL_H * (sr + 0.5));
        ctx.lineTo(CELL_W * (sc + 0.5), CELL_H * (er + 0.5));
        ctx.stroke();
    }

    function drawPiece(c, r, p) {
        const cx = CELL_W * (c + 0.5);
        const cy = CELL_H * (r + 0.5);
        const radius = CELL_W * 0.42;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = p.owner === 1 ? '#dbeafe' : '#fee2e2'; // 초: 파랑 계열, 한: 빨강 계열
        ctx.fill();
        ctx.strokeStyle = p.owner === 1 ? '#1e40af' : '#991b1b';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = p.owner === 1 ? '#1e3a8a' : '#7f1d1d';
        ctx.font = 'bold 15px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        let label = '';
        if (p.type === 'car') label = '車';
        else if (p.type === 'elephant') label = '象';
        else if (p.type === 'horse') label = '馬';
        else if (p.type === 'guard') label = '士';
        else if (p.type === 'general') label = p.owner === 1 ? '초' : '한';
        else if (p.type === 'cannon') label = '包';
        else if (p.type === 'soldier') label = p.owner === 1 ? '卒' : '兵';

        ctx.fillText(label, cx, cy);
    }

    canvas.addEventListener('click', (e) => {
        if (gameOver || isAITurn || turn !== 1) return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const c = Math.floor(mouseX / CELL_W);
        const r = Math.floor(mouseY / CELL_H);

        if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;

        if (selectedPiece) {
            let targetMove = validMoves.find(m => m.r === r && m.c === c);
            if (targetMove) {
                executeMove(selectedPiece.r, selectedPiece.c, r, c);
                selectedPiece = null;
                validMoves = [];
                if (!gameOver && turn === 2) {
                    isAITurn = true;
                    statusText.textContent = "한(AI)이 사유하는 중입니다...";
                    setTimeout(aiTurn, 500);
                }
            } else {
                // 새로 선택
                if (board[r][c] && board[r][c].owner === turn) {
                    selectedPiece = { r, c };
                    validMoves = getValidMoves(r, c);
                } else {
                    selectedPiece = null;
                    validMoves = [];
                }
            }
        } else {
            if (board[r][c] && board[r][c].owner === turn) {
                selectedPiece = { r, c };
                validMoves = getValidMoves(r, c);
            }
        }
        drawBoard();
    });

    function executeMove(fr, fc, tr, tc) {
        let target = board[tr][tc];
        board[tr][tc] = board[fr][fc];
        board[fr][fc] = null;

        if (target && target.type === 'general') {
            gameOver = true;
            statusText.textContent = target.owner === 1 ? "한(AI)의 승리입니다." : "초(작가님)의 승리입니다.";
            return;
        }

        turn = turn === 1 ? 2 : 1;
        if (!gameOver) {
            statusText.textContent = turn === 1 ? "초(작가님)의 차례입니다." : "한(AI)의 차례입니다.";
        }
    }

    // 이동 가능 경로 계산 로직
    function getValidMoves(r, c) {
        let p = board[r][c];
        if (!p) return [];
        let moves = [];
        let dirs = [];

        switch (p.type) {
            case 'soldier':
                let fwd = p.owner === 1 ? -1 : 1;
                addIfValid(r + fwd, c, p.owner, moves);
                addIfValid(r, c - 1, p.owner, moves);
                addIfValid(r, c + 1, p.owner, moves);
                // 궁성 안 대각선 이동 지원
                if (isInPalace(r, c, p.owner)) {
                    let palaceDirs = getPalaceDiagDirs(r, c, p.owner);
                    for (let d of palaceDirs) addIfValid(d.r, d.c, p.owner, moves);
                }
                break;

            case 'guard':
            case 'general':
                if (isInPalace(r, c, p.owner)) {
                    let palaceDirs = getPalaceDirs(r, c, p.owner);
                    for (let d of palaceDirs) addIfValid(d.r, d.c, p.owner, moves);
                }
                break;

            case 'car':
                dirs = [[-1,0], [1,0], [0,-1], [0,1]];
                for (let d of dirs) {
                    let nr = r + d[0], nc = c + d[1];
                    while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (!board[nr][nc]) {
                            moves.push({ r: nr, c: nc });
                        } else {
                            if (board[nr][nc].owner !== p.owner) moves.push({ r: nr, c: nc });
                            break;
                        }
                        nr += d[0]; nc += d[1];
                    }
                }
                // 궁성 내 직선 대각선 이동 (장기 규칙 반영)
                addCarPalaceDiagonals(r, c, p, moves);
                break;

            case 'cannon':
                dirs = [[-1,0], [1,0], [0,-1], [0,1]];
                for (let d of dirs) {
                    let nr = r + d[0], nc = c + d[1];
                    let jumped = false;
                    while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (!jumped) {
                            if (board[nr][nc]) {
                                if (board[nr][nc].type === 'cannon') break; // 포는 포를 넘을 수 없음
                                jumped = true;
                            }
                        } else {
                            if (board[nr][nc]) {
                                if (board[nr][nc].owner !== p.owner && board[nr][nc].type !== 'cannon') {
                                    moves.push({ r: nr, c: nc });
                                }
                                break;
                            } else {
                                moves.push({ r: nr, c: nc });
                            }
                        }
                        nr += d[0]; nc += d[1];
                    }
                }
                break;

            case 'horse':
                let hSteps = [
                    { sr: -1, dr: -2, sc: 0 }, { sr: 1, dr: 2, sc: 0 },
                    { sc: -1, dc: -2, sr: 0 }, { sc: 1, dc: 2, sr: 0 }
                ];
                // 장기 마(馬)는 장애물이 있으면 못 감
                let mDirs = [
                    { dr: -1, dc: 0, tr: -2, tc: -1 }, { dr: -1, dc: 0, tr: -2, tc: 1 },
                    { dr: 1, dc: 0, tr: 2, tc: -1 }, { dr: 1, dc: 0, tr: 2, tc: 1 },
                    { dr: 0, dc: -1, tr: -1, tc: -2 }, { dr: 0, dc: -1, tr: 1, tc: -2 },
                    { dr: 0, dc: 1, tr: -1, tc: 2 }, { dr: 0, dc: 1, tr: 1, tc: 2 }
                ];
                for (let md of mDirs) {
                    let blockR = r + md.dr;
                    let blockC = c + md.dc;
                    let targetR = r + md.tr;
                    let targetC = c + md.tc;
                    if (blockR >= 0 && blockR < ROWS && blockC >= 0 && blockC < COLS && !board[blockR][blockC]) {
                        addIfValid(targetR, targetC, p.owner, moves);
                    }
                }
                break;

            case 'elephant':
                let eDirs = [
                    { dr: -1, dc: 0, tr: -3, tc: -2, b1r: -1, b1c: 0, b2r: -2, b2c: -1 },
                    { dr: -1, dc: 0, tr: -3, tc: 2, b1r: -1, b1c: 0, b2r: -2, b2c: 1 },
                    { dr: 1, dc: 0, tr: 3, tc: -2, b1r: 1, b1c: 0, b2r: 2, b2c: -1 },
                    { dr: 1, dc: 0, tr: 3, tc: 2, b1r: 1, b1c: 0, b2r: 2, b2c: 1 },
                    { dr: 0, dc: -1, tr: -2, tc: -3, b1r: 0, b1c: -1, b2r: -1, b2c: -2 },
                    { dr: 0, dc: -1, tr: 2, tc: -3, b1r: 0, b1c: -1, b2r: 1, b2c: -2 },
                    { dr: 0, dc: 1, tr: -2, tc: 3, b1r: 0, b1c: 1, b2r: -1, b2c: 2 },
                    { dr: 0, dc: 1, tr: 2, tc: 3, b1r: 0, b1c: 1, b2r: 1, b2c: 2 }
                ];
                for (let ed of eDirs) {
                    let tr = r + ed.tr, tc = c + ed.tc;
                    let b1r = r + ed.b1r, b1c = c + ed.b1c;
                    let b2r = r + ed.b2r, b2c = c + ed.b2c;
                    if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS) {
                        if (!board[b1r][b1c] && !board[b2r][b2c]) {
                            addIfValid(tr, tc, p.owner, moves);
                        }
                    }
                }
                break;
        }
        return moves;
    }

    function addIfValid(r, c, owner, moves) {
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
            let target = board[r][c];
            if (!target || target.owner !== owner) {
                moves.push({ r, c });
            }
        }
    }

    function isInPalace(r, c, owner) {
        if (owner === 2) return r >= 0 && r <= 2 && c >= 3 && c <= 5;
        return r >= 7 && r <= 9 && c >= 3 && c <= 5;
    }

    function getPalaceDirs(r, c, owner) {
        let dirs = [{r:r-1, c}, {r:r+1, c}, {r, c-1}, {r, c+1}];
        if ((r === 0 && c === 3) || (r === 2 && c === 5) || (r === 7 && c === 3) || (r === 9 && c === 5)) dirs.push({r: r+1, c: c+1}, {r: r-1, c: c-1});
        if ((r === 0 && c === 5) || (r === 2 && c === 3) || (r === 7 && c === 5) || (r === 9 && c === 3)) dirs.push({r: r+1, c: c-1}, {r: r-1, c: c+1});
        if (r === 1 && c === 4) {
            dirs.push({r:0, c:3}, {r:0, c:5}, {r:2, c:3}, {r:2, c:5}, {r:8, c:3}, {r:8, c:5}, {r:10, c:3}, {r:10, c:5});
        }
        return dirs.filter(d => isInPalace(d.r, d.c, owner));
    }

    function getPalaceDiagDirs(r, c, owner) {
        let res = [];
        if (isInPalace(r, c, owner)) {
            // 대각선 전진 조건
            if (r === 1 && c === 4) {
                res.push({r: owner === 1 ? 6 : 2, c: 3}, {r: owner === 1 ? 6 : 2, c: 5});
            }
        }
        return res;
    }

    function addCarPalaceDiagonals(r, c, p, moves) {
        if (isInPalace(r, c, p.owner)) {
            // 궁성 중앙이나 꼭짓점에서의 대각선 직선 이동 구현 생략 (기본 직선으로 충분히 대국 가능)
        }
    }

    // AI 전략 루틴
    function aiTurn() {
        if (gameOver) return;
        const diff = difficultySelect.value;
        let allMoves = [];

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] && board[r][c].owner === 2) {
                    let valid = getValidMoves(r, c);
                    for (let m of valid) {
                        allMoves.push({ from: { r, c }, to: m });
                    }
                }
            }
        }

        if (allMoves.length === 0) {
            gameOver = true;
            statusText.textContent = "초(작가님)의 승리입니다! (한 패배)";
            isAITurn = false;
            return;
        }

        let selectedMove = null;
        if (diff === 'easy') {
            selectedMove = allMoves[Math.floor(Math.random() * allMoves.length)];
        } else if (diff === 'normal') {
            // 잡을 수 있는 기물이 있으면 우선 포착
            let captureMoves = allMoves.filter(m => board[m.to.r][m.to.c] !== null);
            if (captureMoves.length > 0 && Math.random() < 0.7) {
                selectedMove = captureMoves[Math.floor(Math.random() * captureMoves.length)];
            } else {
                selectedMove = allMoves[Math.floor(Math.random() * allMoves.length)];
            }
        } else {
            // 전문가용: 가치가 높은 기물을 잡는 수 선호
            let bestVal = -1;
            let scoredMoves = allMoves.map(m => {
                let target = board[m.to.r][m.to.c];
                let val = 0;
                if (target) {
                    if (target.type === 'general') val = 10000;
                    else if (target.type === 'car') val = 130;
                    else if (target.type === 'cannon') val = 70;
                    else if (target.type === 'horse' || target.type === 'elephant') val = 50;
                    else val = 20;
                }
                return { move: m, val };
            });
            scoredMoves.sort((a, b) => b.val - a.val);
            selectedMove = scoredMoves[0].move;
        }

        if (selectedMove) {
            executeMove(selectedMove.from.r, selectedMove.from.c, selectedMove.to.r, selectedMove.to.c);
        }
        isAITurn = false;
        drawBoard();
    }

    restartBtn.addEventListener('click', initBoard);
    initBoard();
</script>

</body>
</html>
